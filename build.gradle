plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	// Produces: expandedstorage-rk-fabric-1.20.4-1.0.0.jar
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
	// Expanded Storage depends only on Minecraft, Fabric Loader and Fabric API.
	// Loom adds the required Mojang and Fabric repositories automatically.
}

loom {
	// Opens Slot.x / Slot.y so the client screen can re-position slots for dynamic layouts.
	accessWidenerPath = file("src/main/resources/expandedstorage.accesswidener")
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = project.mod_id
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API - the only mod dependency.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	def expandProps = [
		"version"          : project.version,
		"minecraft_version": project.minecraft_version,
		"loader_version"   : project.loader_version,
		"fabric_version"   : project.fabric_version,
		"java_version"     : project.java_version
	]
	inputs.properties(expandProps)

	filesMatching("fabric.mod.json") {
		expand(expandProps)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("sourcesJar") {
	mustRunAfter("runDatagen")
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.base.archivesName.get()
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
